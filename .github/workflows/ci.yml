name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  golang:
    name: Golang
    permissions:
      contents: write
      pull-requests: write
      checks: write
    uses: depado/github-actions/.github/workflows/golang.yml@main
    with:
      build-command: make build-noproto

  docker:
    name: Docker
    needs: [golang]
    permissions:
      contents: read
      packages: write
      actions: read
    uses: depado/github-actions/.github/workflows/docker.yml@main
    with:
      enable-cleanup: false

  docker-packed:
    name: Docker Packed
    needs: [golang]
    permissions:
      contents: read
      packages: write
      actions: read
    uses: depado/github-actions/.github/workflows/docker.yml@main
    with:
      dockerfile: "./Dockerfile.pack"
      tag-suffix: "-packed"
      tag-latest: false
      enable-cleanup: false

  container-retention-policy:
    name: Container Retention Policy
    if: github.event_name != 'pull_request'
    needs: [docker, docker-packed]
    permissions:
      packages: write
    uses: depado/github-actions/.github/workflows/container-retention-policy.yml@main
